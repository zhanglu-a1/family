server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: family-memoir
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:family_memoir}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

family:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:family-memoir-default-secret-please-override-in-production}
    access-token-ttl: ${JWT_ACCESS_TTL:2h}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET:}
    dir-prefix: ${OSS_DIR_PREFIX:family-memoir/}
    signed-url-expire: ${OSS_SIGNED_URL_EXPIRE:1h}
    max-file-size: 100MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - mp4
      - mov
      - mp3
      - m4a
      - wav

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.family.memoir: debug
